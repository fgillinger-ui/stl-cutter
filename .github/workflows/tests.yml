name: Tester

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt behöver de här även för att köras utan skärm. Utan dem hoppas
      # GUI-testerna tyst över, och då hade CI:n ljugit om täckningen.
      - name: Installera systembibliotek för Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxrender1 libxi6 libglib2.0-0 libopengl0

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Kontrollera att GUI-testerna kan köras
        run: python -c "import PySide6.QtWidgets, pyqtgraph; print('Qt tillgängligt')"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Kör testerna
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  install-script:
    name: install.sh
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera skriptets syntax
        run: bash -n install.sh

      - name: Granska med shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning install.sh
